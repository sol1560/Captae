# 贡献者协议（CLA，正文在 CONTRIBUTING.md）：PR 的作者第一次提 PR 时，机器人在 PR 里请他回复一句话签署；签过的人记在 cla-signatures 分支的 signatures/cla.json 里。
# 用的是 contributor-assistant/github-action（Apache-2.0），不用装第三方 GitHub 应用。
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/sol1560/Captae/blob/main/CONTRIBUTING.md
          branch: cla-signatures
          allowlist: sol1560,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: |
            感谢你的贡献！合并之前要请你先同意 Captae 的[贡献者协议（CLA）](https://github.com/sol1560/Captae/blob/main/CONTRIBUTING.md)：它允许 Captae 以后改用更宽松的开源许可证（MIT、Unlicense）发布你的代码，但不能改成闭源；你的版权还是你的。同意的话，在这个 PR 里回复下面这句英文（原样复制）。

            Thanks for your contribution! Before we can merge it, please agree to Captae's [Contributor License Agreement](https://github.com/sol1560/Captae/blob/main/CONTRIBUTING.md). It lets Captae release your code under a more permissive open source license later (MIT, Unlicense), never as closed source, and you keep your copyright. To agree, reply in this pull request with the sentence below, exactly as written.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: 所有作者都已经签署贡献者协议。All contributors have signed the CLA.
